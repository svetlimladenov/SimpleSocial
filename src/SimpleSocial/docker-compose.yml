version: "3.8"
services:
    web:
      container_name: web
      build: 
        context: .
        dockerfile: Web/Mvc/SimpleSocial.Web/Dockerfile
      ports:
          - "8080:80"
      depends_on:
        - db
      restart: on-failure
    db:
      container_name: db
      image: "mcr.microsoft.com/azure-sql-edge:latest"
      ports:
        - "1433:1433"
      environment:
        SA_PASSWORD: "Strongpassword1!"
        ACCEPT_EULA: "Y"